; PlatformIO Project Configuration File for ESP-Miner-NerdQAxePlus
; ESP32-S3 Bitcoin Miner Firmware
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nerdqaxeplus2
src_dir = main

; Common settings for all environments
[env]
platform = platformio/espressif32 @ ^6.12.0
framework = espidf
;platform_packages = 
;    platformio/framework-espidf @ ~3.50500.0

; Board settings
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.flash_size = 16MB
board_build.filesystem = spiffs
board_upload.flash_size = 16MB

; Monitor settings
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    colorize

; Build settings
build_flags = 
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_MEM_CUSTOM=1
    ;-DLV_MEM_CUSTOM_INCLUDE="\<lvgl_psram.h\>"
    -DLV_MEM_CUSTOM_ALLOC=lv_psram_alloc
    -DLV_MEM_CUSTOM_FREE=lv_psram_free
    -DLV_MEM_CUSTOM_REALLOC=lv_psram_realloc
    -I./main
    -I./components/arduinojson

; Extra scripts for web UI build (optional)
; extra_scripts = pre:build_webui.py

; Set BOARD environment variable based on selected environment
extra_scripts =
    pre:set_board_env.py
    post:esp32_combine_bin.py

; ESP-IDF specific sdkconfig options
board_build.embed_txtfiles = 
    main/http_server/axe-os/dist/axe-os/index.html

board_build.cmake_extra_args = 
    -DCMAKE_CXX_STANDARD=17
    -DSOURCE_DATE_EPOCH=0

; Dependencies from IDF Component Manager
lib_deps = 
    lvgl/lvgl@8.3.11

; ============================================================
; Environment: NerdQAxePlus2 (Default)
; ============================================================
[env:nerdqaxeplus2]
build_flags = 
    ${env.build_flags}
    -DNERDQAXEPLUS2

; ============================================================
; Environment: NerdQAxePlus
; ============================================================
[env:nerdqaxeplus]
build_flags = 
    ${env.build_flags}
    -DNERDQAXEPLUS

; ============================================================
; Environment: NerdOctaXePlus
; ============================================================
[env:nerdoctaxeplus]
build_flags = 
    ${env.build_flags}
    -DNERDOCTAXEPLUS

; ============================================================
; Environment: NerdOctaXeGamma
; ============================================================
[env:nerdoctaxegamma]
build_flags = 
    ${env.build_flags}
    -DNERDOCTAXEGAMMA

; ============================================================
; Environment: NerdHAxeGamma
; ============================================================
[env:nerdhaxegamma]
build_flags = 
    ${env.build_flags}
    -DNERDHAXEGAMMA

; ============================================================
; Environment: NerdAxeGamma
; ============================================================
[env:nerdaxegamma]
build_flags = 
    ${env.build_flags}
    -DNERDAXEGAMMA

; ============================================================
; Environment: NerdAxe
; ============================================================
[env:nerdaxe]
build_flags = 
    ${env.build_flags}
    -DNERDAXE

; ============================================================
; Environment: NerdQX
; ============================================================
[env:nerdqx]
build_flags = 
    ${env.build_flags}
    -DNERDQX

; ============================================================
; Environment: NerdEko
; ============================================================
[env:nerdeko]
build_flags = 
    ${env.build_flags}
    -DNERDEKO
